# Fast local development settings.
#
# This profile is for quick code feedback on small datasets. It keeps the same
# local data lake paths as the main config, but disables nonessential audit
# counts that are useful for checkpoints and expensive during repeated edits.
environment: dev_fast
spark:
  app_name: TelecomNetworkReliabilityPlatform
  master: local[*]
  adaptive_query_execution: true
  use_pyspark_package: true
  shuffle_partitions: 8

quality:
  output_partitions: 1
  persist_classified_tables:
    - network_events
    - calls
    - data_sessions
  output_partitioning:
    strategy: auto
    target_file_size_mb: 128
    min_partitions: 1
    max_partitions: 64

silver:
  output_partitioning:
    strategy: none
    tiny_file_threshold_mb: 1
    tiny_file_partitions: 1
    target_file_size_mb: 128
    min_partitions: 2
    max_partitions: 64

bronze:
  output_partitioning:
    strategy: auto
    tiny_file_threshold_mb: 1
    tiny_file_partitions: 1
    target_file_size_mb: 128
    min_partitions: 2
    max_partitions: 64

gold:
  persist_tower_daily_for_region: false

audit:
  count_bronze_inputs: false
  count_quality_outputs: false
  count_silver_outputs: true
  count_gold_outputs: false

paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  quarantine: data/quarantine

incremental:
  registry_path: data/registry/batch_registry.json

dev_workflow:
  default_profile: tiny_messy
  default_batch_id: DEV_FAST_BATCH
  default_affected_tables:
    - network_events
